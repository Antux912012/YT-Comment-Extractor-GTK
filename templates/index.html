<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Comment Extractor</title>
    <style>
        /* Nord Palette Colors */
        :root {
            --nord0: #2E3440;
            --nord1: #3B4252;
            --nord2: #434C5E;
            --nord3: #4C566A;
            --nord4: #D8DEE9;
            --nord5: #E5E9F0;
            --nord6: #ECEFF4;
            --nord7: #8FBCBB;
            --nord8: #88C0D0;
            --nord9: #81A1C1;
            --nord10: #5E81AC;
            --nord11: #BF616A;
            --nord12: #D08770;
            --nord13: #EBCB8B;
            --nord14: #A3BE8C;
            --nord15: #B48EAD;
        }

        body {
            background-color: var(--nord0);
            color: var(--nord4);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            background-color: var(--nord1);
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 600px;
        }

        h1 {
            color: var(--nord8);
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--nord4);
        }

        input[type="text"], input[type="number"], select, input[type="file"] {
            width: 100%;
            padding: 10px;
            background-color: var(--nord2);
            border: 1px solid var(--nord3);
            color: var(--nord6);
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--nord10);
            color: var(--nord6);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--nord9);
        }

        .logs {
            background-color: var(--nord0);
            padding: 10px;
            border-radius: 4px;
            height: 150px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            color: var(--nord13);
            margin-top: 20px;
            border: 1px solid var(--nord3);
        }

        .status-bar {
            margin-top: 15px;
            text-align: center;
            color: var(--nord14);
            font-weight: bold;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>YT Comment Extractor Web</h1>
    <form id="extractForm">
        <div class="form-group">
            <label>YouTube Video URL or ID</label>
            <input type="text" id="url" name="url" required placeholder="https://www.youtube.com/watch?v=...">
        </div>
        
        <div class="form-group">
            <label>Order on YouTube</label>
            <select name="sort_mode" id="sort_mode">
                <option value="0">Top Comments</option>
                <option value="1">Newest First</option>
            </select>
        </div>

        <div class="form-group">
            <label>Sampling Strategy</label>
            <select name="strategy_idx" id="strategy_idx">
                <option value="0">Extract All Comments</option>
                <option value="1">Head and Tail Limits</option>
                <option value="2">Random Uniform</option>
            </select>
        </div>

        <div class="form-group" id="sample_size_div" style="display:none;">
            <label>Sample Size</label>
            <input type="number" name="sample_size" id="sample_size" value="100">
        </div>
        
        <div class="form-group" id="pool_size_div" style="display:none;">
            <label>Deep Scan Pool Size</label>
            <input type="number" name="pool_size" id="pool_size" value="1000">
        </div>

        <div class="form-group">
            <label>
                <input type="checkbox" name="include_replies" value="true">
                Include Replies (Threaded)
            </label>
        </div>

        <div class="form-group">
            <label>Cookies File (Optional)</label>
            <input type="file" name="cookies" id="cookies" accept=".txt">
        </div>

        <button type="submit" id="startBtn">Extract Comments</button>
    </form>

    <div class="status-bar" id="statusLabel">Status: Idle</div>
    <div class="logs" id="logsBox">Logs will appear here...</div>
    
    <button id="downloadBtn" class="hidden" style="background-color: var(--nord14);" onclick="window.location='/api/download'">Download CSV</button>
</div>

<script>
    const form = document.getElementById('extractForm');
    const startBtn = document.getElementById('startBtn');
    const strategySelect = document.getElementById('strategy_idx');
    const sampleSizeDiv = document.getElementById('sample_size_div');
    const poolSizeDiv = document.getElementById('pool_size_div');
    const statusLabel = document.getElementById('statusLabel');
    const logsBox = document.getElementById('logsBox');
    const downloadBtn = document.getElementById('downloadBtn');

    let pollInterval = null;

    strategySelect.addEventListener('change', (e) => {
        if (e.target.value === "0") {
            sampleSizeDiv.style.display = 'none';
            poolSizeDiv.style.display = 'none';
        } else {
            sampleSizeDiv.style.display = 'block';
            poolSizeDiv.style.display = 'block';
        }
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        startBtn.disabled = true;
        downloadBtn.classList.add('hidden');
        
        const formData = new FormData(form);
        
        try {
            const res = await fetch('/api/start', {
                method: 'POST',
                body: formData
            });
            
            if (res.ok) {
                statusLabel.innerText = "Status: Starting...";
                pollInterval = setInterval(pollStatus, 1000);
            } else {
                const err = await res.json();
                alert(err.error || "An error occurred");
                startBtn.disabled = false;
            }
        } catch (err) {
            console.error(err);
            startBtn.disabled = false;
        }
    });

    async function pollStatus() {
        try {
            const res = await fetch('/api/status');
            const data = await res.json();
            
            statusLabel.innerText = `Status: ${data.status} | Progress: ${data.progress}`;
            
            if (data.logs && data.logs.length > 0) {
                logsBox.innerHTML = data.logs.join('<br>');
                logsBox.scrollTop = logsBox.scrollHeight;
            }
            
            if (data.status === 'done' || data.status === 'error') {
                clearInterval(pollInterval);
                startBtn.disabled = false;
                if (data.status === 'done') {
                    downloadBtn.classList.remove('hidden');
                }
            }
        } catch (err) {
            console.error(err);
        }
    }
</script>
</body>
</html>
