<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Material Elevation / Soft Shadows -->
    <filter id="surface-shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.18" />
    </filter>

    <filter id="fab-shadow" x="-20%" y="-20%" width="140%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.32" />
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.2" />
    </filter>

    <!-- YouTube Red Gradient -->
    <linearGradient id="yt-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A1A" />
      <stop offset="100%" stop-color="#D90007" />
    </linearGradient>

    <!-- Material Surface / Dark Container -->
    <linearGradient id="bg-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1F22" />
      <stop offset="100%" stop-color="#121316" />
    </linearGradient>

    <!-- FAB Accent Gradient (Tonal Teal) -->
    <linearGradient id="fab-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38E1FF" />
      <stop offset="100%" stop-color="#00A8CC" />
    </linearGradient>
  </defs>

  <!-- Base App Icon Container (Squircle / Android Adaptive Shape) -->
  <rect 
    x="32" 
    y="32" 
    width="448" 
    height="448" 
    rx="104" 
    fill="url(#bg-surface)" 
  />

  <!-- Subtle Inner Border Highlight -->
  <rect 
    x="32" 
    y="32" 
    width="448" 
    height="448" 
    rx="104" 
    fill="none" 
    stroke="#FFFFFF" 
    stroke-opacity="0.06" 
    stroke-width="2" 
  />

  <!-- Main Comment Bubble (YouTube Red with Material Elevation) -->
  <g filter="url(#surface-shadow)">
    <!-- Speech bubble with subtle lower tail -->
    <path 
      d="M 120 120
         C 120 102.3 134.3 88 152 88
         L 360 88
         C 377.7 88 392 102.3 392 120
         L 392 272
         C 392 289.7 377.7 304 360 304
         L 230 304
         L 160 364
         C 148 374 130 365.5 130 350
         L 130 304
         L 120 304
         C 102.3 304 88 289.7 88 272
         L 88 120
         C 88 102.3 102.3 88 120 88 Z" 
      fill="url(#yt-red)" 
    />
  </g>

  <!-- YouTube Play Accent / Structured Text Lines inside Comment Bubble -->
  <g fill="#FFFFFF" opacity="0.95">
    <!-- Play Triangle (YouTube Signifier) -->
    <path d="M 148 150 C 148 143.5 155.2 139.5 160.8 143.2 L 202 170.8 C 207 174.1 207 181.9 202 185.2 L 160.8 212.8 C 155.2 216.5 148 212.5 148 206 Z" />

    <!-- Comment Content Skeleton Bars -->
    <rect x="232" y="152" width="112" height="18" rx="9" />
    <rect x="232" y="184" width="76" height="18" rx="9" />
    <rect x="148" y="234" width="196" height="18" rx="9" fill-opacity="0.65" />
  </g>

  <!-- Material Floating Action Button (FAB) for Download Action -->
  <g filter="url(#fab-shadow)">
    <circle cx="360" cy="350" r="74" fill="url(#fab-accent)" />
    
    <!-- Material Download Icon inside FAB -->
    <g fill="#003543">
      <!-- Downward Arrow -->
      <path d="M 360 310 
               C 365 310 369 314 369 319 
               L 369 350 
               L 384 350 
               C 389.5 350 392.3 356.6 388.4 360.5 
               L 364.4 384.5 
               C 362 386.9 358 386.9 355.6 384.5 
               L 331.6 360.5 
               C 327.7 356.6 330.5 350 336 350 
               L 351 350 
               L 351 319 
               C 351 314 355 310 360 310 Z" />
      <!-- Baseline Tray -->
      <rect x="330" y="394" width="60" height="12" rx="6" />
    </g>
  </g>
</svg>
